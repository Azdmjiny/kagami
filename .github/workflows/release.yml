name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./script/test.sh
      - name: Build installation packages
        run: |
          # Publish a manual-install release until both update-signing keys are configured.
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" || -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            SPARKLE_PUBLIC_ED_KEY=""
            SPARKLE_PRIVATE_ED_KEY=""
          fi
          KAGAMI_VERSION="${GITHUB_REF_NAME#v}" KAGAMI_CONFIGURATION=release ./script/build_and_run.sh --package
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent dist/Kagami.app "release/Kagami-${GITHUB_REF_NAME}.zip"
          mkdir dist/dmg
          ditto dist/Kagami.app dist/dmg/Kagami.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Kagami -srcfolder dist/dmg -ov -format UDZO "release/Kagami-${GITHUB_REF_NAME}.dmg"
          if [[ -n "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" release
          fi
          shasum -a 256 release/*.zip release/*.dmg > release/SHA256SUMS.txt
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          name: Kagami ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
